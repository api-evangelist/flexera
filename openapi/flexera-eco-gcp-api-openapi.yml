openapi: 3.2.0
info:
  title: Spot Eco Eco GCP API
  description: The Spot Eco API provides programmatic access to cloud commitment management and optimization across AWS, Azure, and GCP. Eco automates the purchase, management, and optimization of reserved instances, savings plans, and committed use discounts to maximize cloud cost savings while maintaining flexibility.
  version: 2.0.0
  contact:
    name: Spot by Flexera
    url: https://docs.spot.io/
  termsOfService: https://spot.io/terms-of-use/
servers:
- url: https://api.spotinst.io
  description: Spot Production API
security:
- bearerAuth: []
tags:
- name: Eco GCP
  description: Manage Eco commitment optimization for GCP committed use discounts.
paths:
  /eco/gcp/commitmentPlan:
    get:
      operationId: listCommitmentPlansGCP
      summary: Spot List Commitment Plans (gcp)
      description: List all GCP committed use discount plans managed by Eco.
      tags:
      - Eco GCP
      parameters:
      - name: accountId
        in: query
        schema:
          type: string
        example: '500123'
      responses:
        '200':
          description: Successful response
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Spot API uses Bearer Token Authentication. Include your API token in the Authorization header.
