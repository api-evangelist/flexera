aid: spot
name: Spot
description: >-
  Spot AI is a physical-security video-AI platform that turns surveillance
  cameras into AI agents which monitor spaces 24/7, detect suspicious activity,
  and trigger automated responses across retail, manufacturing, construction,
  healthcare, and education. The Spot AI Developer API is a JSON REST API on
  https://dev-api.spot.ai/ (bearer API-key auth) with three surfaces: Devices
  (locations, appliances, cameras, live/VOD embeds, historical footage, zones,
  shared searches, audio playback), Intelligence (people/vehicle counting,
  idle/presence analytics, and License Plate Recognition interest lists), and
  Spot Connect (a beta integrations platform that links external business events
  to camera footage via integrations, devices, event types, and events, with
  signed RSA256 webhooks for real-time delivery).
